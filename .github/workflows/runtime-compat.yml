name: Runtime Compatibility
permissions:
  contents: read
'on':
  workflow_dispatch:
jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          mise_toml: |
            [tools]
            bun = "latest"
      - run: bun install
      - run: bun test tests/
  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          mise_toml: |
            [tools]
            deno = "latest"
      - run: deno install
      - run: deno test --no-check --allow-read tests/**/*.ts
