name: Runtime Compatibility
permissions:
  contents: read
'on':
  workflow_dispatch:
jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          mise_toml: |
            [tools]
            bun = "latest"
      - run: bun install
      - run: bun test tests/
  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          mise_toml: |
            [tools]
            deno = "latest"
      - run: deno install
      - run: deno test --no-check --allow-read tests/**/*.ts
