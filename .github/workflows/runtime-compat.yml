name: Runtime Compatibility
permissions:
  contents: read
'on':
  workflow_dispatch:
jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          mise_toml: |
            [tools]
            bun = "latest"
      - run: bun install
      - run: bun test tests/
  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          mise_toml: |
            [tools]
            deno = "latest"
      - run: deno install
      - run: deno test --no-check --allow-read tests/**/*.ts
