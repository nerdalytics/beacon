name: Runtime Compatibility
permissions:
  contents: read
'on':
  workflow_dispatch:
jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          mise_toml: |
            [tools]
            bun = "latest"
      - run: bun install
      - run: bun test tests/
  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          mise_toml: |
            [tools]
            deno = "latest"
      - run: deno install
      - run: deno test --no-check --allow-read tests/**/*.ts
