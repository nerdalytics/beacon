name: Build & Test & Publish
permissions:
  contents: read
'on':
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
jobs:
  warm-cache:
    uses: ./.github/workflows/update-dependencies-cache.yml
    with:
      ref: '${{ github.ref }}'
  build:
    needs: warm-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.x
      - id: cache-dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24.x-${{ hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: exit 1
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: latest
      - name: Check linting & code formatting
        run: biome check
      - name: Build project
        run: 'npm run build:lts'
      - name: Upload dist directory
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/
  test-lts-20:
    needs: build
    strategy:
      matrix:
        node-version:
          - 20.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '${{ matrix.node-version }}'
      - id: cache-dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: >-
            ${{ runner.os }}-node-${{ matrix.node-version }}-${{
            hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required.
          exit 1
      - name: Download dist directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Diagnostic checks
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory structure:"
          ls -la
          echo "Dist directory content:"
          ls -la dist/ || echo "dist directory not found!"
          echo "Find test files:"
          find . -name "*.js" | grep -i test || echo "No test files found!"
      - name: Test project
        run: 'npm run test:lts:20'
  test-lts-22:
    needs: build
    strategy:
      matrix:
        node-version:
          - 22.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '${{ matrix.node-version }}'
      - id: cache-dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: >-
            ${{ runner.os }}-node-${{ matrix.node-version }}-${{
            hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required.
          exit 1
      - name: Download dist directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Diagnostic checks
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory structure:"
          ls -la
          echo "Dist directory content:"
          ls -la dist/ || echo "dist directory not found!"
          echo "Find test files:"
          find . -name "*.js" | grep -i test || echo "No test files found!"
      - name: Test project
        run: 'npm run test:lts:22'
  publish-npm:
    needs:
      - test-lts-20
      - test-lts-22
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
      - id: cache-dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24.x-${{ hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required.
          exit 1
      - name: Download dist directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: npm publish --access public
