name: Build & Test & Publish
permissions:
  contents: read
'on':
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
jobs:
  warm-cache:
    uses: ./.github/workflows/update-dependencies-cache.yml
    with:
      ref: '${{ github.ref }}'
  build:
    needs: warm-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - id: cache-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24.x-${{ hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: exit 1
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: latest
      - name: Check linting & code formatting
        run: biome check
      - name: Build project
        run: 'npm run build:lts'
      - name: Check version sync (package.json ↔ jsr.json)
        run: .github/scripts/check-version-sync.sh
      - name: Validate JSR package
        run: npx jsr publish --dry-run
      - name: Upload dist directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
  test-lts-22:
    needs: build
    strategy:
      matrix:
        node-version:
          - 22.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ matrix.node-version }}'
      - id: cache-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: >-
            ${{ runner.os }}-node-${{ matrix.node-version }}-${{
            hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required.
          exit 1
      - name: Download dist directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Diagnostic checks
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory structure:"
          ls -la
          echo "Dist directory content:"
          ls -la dist/ || echo "dist directory not found!"
          echo "Find test files:"
          find . -name "*.js" | grep -i test || echo "No test files found!"
      - name: Test project
        run: 'npm run test:lts:22'
  check-version:
    needs: test-lts-22
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: check
        run: .github/scripts/check-version.sh
  publish-npm:
    needs:
      - check-version
      - test-lts-22
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
      - id: cache-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24.x-${{ hashFiles('**/package-lock.json') }}
      - name: Ensure cache exists
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Update cached dependencies required.
          exit 1
      - name: Download dist directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: npm publish --access public
  publish-jsr:
    needs:
      - check-version
      - test-lts-22
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx jsr publish
